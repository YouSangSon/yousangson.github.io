<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계산을 건너뛰어도 효과는 남겨야 한다</title><style>*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}:root{--paper:oklch(97% .018 85);--surface:oklch(94% .018 85);--ink:oklch(24% .018 55);--muted:oklch(42% .018 55);--accent:#93452d;--tint:rgba(147,69,45,.08);--rule:oklch(42% .018 55 / .28);--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;--serif:Georgia,"Times New Roman","Apple SD Gothic Neo","Noto Sans KR",serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}h1{font-family:var(--serif);font-size:24px;font-weight:400;line-height:1.4;margin:14px 16px 8px}.diagram-container{width:100%;max-width:720px;margin:auto}svg{display:block;width:100%;height:auto}.mobile{display:none}text{font-family:var(--sans);fill:var(--ink);font-size:14px}.name{font-size:16px;font-weight:600}.group{font-size:16px;font-weight:600}.detail{font-size:14px;fill:var(--muted)}.mono{font-family:var(--mono);font-size:14px;fill:var(--muted)}.note{font-size:14px;fill:var(--muted)}.node{fill:var(--paper);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.zone{fill:var(--surface);stroke:var(--rule)}.edge{fill:none;stroke:var(--muted);stroke-width:1.5}.accent-edge{stroke:var(--accent)}.rule{stroke:var(--rule)}@media(prefers-color-scheme:dark){:root{--paper:oklch(20% .012 55);--surface:oklch(24% .012 55);--ink:oklch(93% .015 80);--muted:oklch(78% .018 75);--accent:#e5a387;--tint:rgba(229,163,135,.08);--rule:oklch(78% .018 75 / .28)}}@media(max-width:640px){h1{font-size:21px}.desktop{display:none}.mobile{display:block;max-width:300px;margin:auto}.detail,.mono,.note{font-size:16px}}</style></head><body><h1>계산을 건너뛰어도 효과는 남겨야 한다</h1><div class="diagram-container"><svg class="desktop" viewBox="0 0 720 464" xmlns="http://www.w3.org/2000/svg" role="img"
