<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>단서를 따로 찾으면 순위가 갈린다</title><style>*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}:root{--paper:oklch(97% .018 85);--surface:oklch(94% .018 85);--ink:oklch(24% .018 55);--muted:oklch(42% .018 55);--accent:#93452d;--tint:rgba(147,69,45,.08);--rule:oklch(42% .018 55 / .28);--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;--serif:Georgia,"Times New Roman","Apple SD Gothic Neo","Noto Sans KR",serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}h1{font-family:var(--serif);font-size:24px;font-weight:400;line-height:1.4;margin:14px 16px 8px}.diagram-container{width:100%;max-width:720px;margin:auto}svg{display:block;width:100%;height:auto}.mobile{display:none}text{font-family:var(--sans);fill:var(--ink);font-size:14px}.name{font-size:16px;font-weight:600}.group{font-size:16px;font-weight:600}.detail{font-size:14px;fill:var(--muted)}.mono{font-family:var(--mono);font-size:14px;fill:var(--muted)}.note{font-size:14px;fill:var(--muted)}.node{fill:var(--paper);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.zone{fill:var(--surface);stroke:var(--rule)}.edge{fill:none;stroke:var(--muted);stroke-width:1.5}.accent-edge{stroke:var(--accent)}.rule{stroke:var(--rule)}@media(prefers-color-scheme:dark){:root{--paper:oklch(20% .012 55);--surface:oklch(24% .012 55);--ink:oklch(93% .015 80);--muted:oklch(78% .018 75);--accent:#e5a387;--tint:rgba(229,163,135,.08);--rule:oklch(78% .018 75 / .28)}}@media(max-width:640px){h1{font-size:21px}.desktop{display:none}.mobile{display:block;max-width:300px;margin:auto}.detail,.mono,.note{font-size:16px}}</style></head><body><h1>단서를 따로 찾으면 순위가 갈린다</h1><div class="diagram-container"><svg class="desktop" viewBox="0 0 720 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="late-interaction-clues-desktop-title late-interaction-clues-desktop-desc"><title id="late-interaction-clues-desktop-title">단서를 따로 찾으면 순위가 갈린다</title><desc id="late-interaction-clues-desktop-desc">두 질의 토큰을 각각 문서 토큰과 비교해 최댓값을 합하면 두 단서가 있는 문서 A는 2점, 첫 단서만 반복한 문서 B는 1점이다. 단순 평균 벡터 내적에서는 둘 다 0.5점이다.</desc><defs><marker id="late-interaction-clues-desktop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker><marker id="late-interaction-clues-desktop-accent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="47" class="note" text-anchor="start">질의 q₁=(1,0), q₂=(0,1)</text><text x="24" y="87" class="group" text-anchor="start">두 단서를 가진 문서 A</text><line class="edge accent-edge" x1="324" y1="145" x2="388" y2="145" marker-end="url(#late-interaction-clues-desktop-accent-arrow)"/><text x="24" y="267" class="group" text-anchor="start">첫 단서만 반복한 문서 B</text><line class="edge" x1="324" y1="325" x2="388" y2="325" marker-end="url(#late-interaction-clues-desktop-arrow)"/><rect class="node" x="24" y="100" width="300" height="90" rx="6"/><text x="174.0" y="134" class="name" text-anchor="middle">A 토큰</text><text x="174.0" y="157" class="detail" text-anchor="middle">(1,0) · (0,1)</text><rect class="focal" x="388" y="100" width="308" height="90" rx="6"/><text x="542.0" y="134" class="name" text-anchor="middle">A: MaxSim 2</text><text x="542.0" y="157" class="detail" text-anchor="middle">max q₁=1 + max q₂=1</text><rect class="node" x="24" y="280" width="300" height="90" rx="6"/><text x="174.0" y="314" class="name" text-anchor="middle">B 토큰</text><text x="174.0" y="337" class="detail" text-anchor="middle">(1,0) · (1,0)</text><rect class="node" x="388" y="280" width="308" height="90" rx="6"/><text x="542.0" y="314" class="name" text-anchor="middle">B: MaxSim 1</text><text x="542.0" y="337" class="detail" text-anchor="middle">max q₁=1 + max q₂=0</text><line class="rule" x1="24" y1="415" x2="696" y2="415"/><text x="24" y="445" class="note" text-anchor="start">단순 평균 벡터의 내적: A=0.5, B=0.5 · 점수식 비교용 예시</text></svg><svg class="mobile" viewBox="0 0 300 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="late-interaction-clues-mobile-title late-interaction-clues-mobile-desc"><title id="late-interaction-clues-mobile-title">단서를 따로 찾으면 순위가 갈린다</title><desc id="late-interaction-clues-mobile-desc">두 질의 토큰을 각각 문서 토큰과 비교해 최댓값을 합하면 두 단서가 있는 문서 A는 2점, 첫 단서만 반복한 문서 B는 1점이다. 단순 평균 벡터 내적에서는 둘 다 0.5점이다.</desc><defs><marker id="late-interaction-clues-mobile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker><marker id="late-interaction-clues-mobile-accent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="16" y="38" class="note" text-anchor="start">질의 q₁=(1,0), q₂=(0,1)</text><text x="16" y="86" class="group" text-anchor="start">문서 A · 두 단서</text><line class="edge accent-edge" x1="150" y1="178" x2="150" y2="206" marker-end="url(#late-interaction-clues-mobile-accent-arrow)"/><rect class="node" x="16" y="102" width="268" height="76" rx="6"/><text x="150.0" y="136" class="name" text-anchor="middle">A 토큰</text><text x="150.0" y="159" class="detail" text-anchor="middle">(1,0) · (0,1)</text><rect class="focal" x="16" y="206" width="268" height="76" rx="6"/><text x="150.0" y="240" class="name" text-anchor="middle">MaxSim 2</text><text x="150.0" y="263" class="detail" text-anchor="middle">1 + 1</text><text x="16" y="334" class="group" text-anchor="start">문서 B · 첫 단서 반복</text><line class="edge" x1="150" y1="426" x2="150" y2="454" marker-end="url(#late-interaction-clues-mobile-arrow)"/><rect class="node" x="16" y="350" width="268" height="76" rx="6"/><text x="150.0" y="384" class="name" text-anchor="middle">B 토큰</text><text x="150.0" y="407" class="detail" text-anchor="middle">(1,0) · (1,0)</text><rect class="node" x="16" y="454" width="268" height="76" rx="6"/><text x="150.0" y="488" class="name" text-anchor="middle">MaxSim 1</text><text x="150.0" y="511" class="detail" text-anchor="middle">1 + 0</text><line class="rule" x1="16" y1="571" x2="284" y2="571"/><text x="16" y="604" class="name" text-anchor="start">단순 평균 내적은 동점</text><text x="16" y="630" class="note" text-anchor="start">A=0.5 · B=0.5</text><text x="16" y="675" class="note" text-anchor="start">점수식 비교용 예시</text></svg></div></body></html>
