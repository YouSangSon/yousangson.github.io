<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GLIE는 상위 후보만 복원한다</title>
<style>
*{box-sizing:border-box}:root{--paper:oklch(97% .018 85);--ink:oklch(24% .018 55);--muted:oklch(42% .018 55);--accent:#93452d;--tint:rgba(147,69,45,.08);--rule:oklch(42% .018 55 / .28);--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;--serif:Georgia,"Times New Roman","Apple SD Gothic Neo","Noto Sans KR",serif}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}h1{max-width:720px;margin:16px auto 4px;padding:0 16px;font:400 24px/1.35 var(--serif)}p{max-width:720px;margin:0 auto 8px;padding:0 16px;color:var(--muted);font-size:14px;line-height:1.5}.diagram{width:100%;max-width:720px;margin:auto}svg{display:block;width:100%;height:auto}.mobile{display:none}svg text{font-family:var(--sans);fill:var(--ink);font-size:14px}svg .name{font-size:16px;font-weight:650}svg .detail{fill:var(--muted);font-size:14px}svg .node{fill:var(--paper);stroke:var(--rule);stroke-width:1.2}svg .focal{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}svg .edge{fill:none;stroke:var(--muted);stroke-width:1.5}svg .edge-focal{fill:none;stroke:var(--accent);stroke-width:1.8}svg .rule{stroke:var(--rule);stroke-width:1}@media(max-width:640px){.desktop{display:none}.mobile{display:block;max-width:360px;margin:auto}.mobile .name{font-size:18px}.mobile .detail{font-size:16px}}@media(prefers-color-scheme:dark){:root{--paper:oklch(20% .012 55);--ink:oklch(93% .015 80);--muted:oklch(78% .018 75);--accent:#e5a387;--tint:rgba(229,163,135,.08);--rule:oklch(78% .018 75 / .28)}}
</style></head><body><h1>네 벡터로 찾고, 후보에서만 복원한다</h1><p>1차 검색에서 빠진 쪽과 후보 안의 복원 오차는 서로 다른 한계다.</p><div class="diagram" role="group" aria-label="GLIE의 두 단계 검색 흐름">
<svg class="desktop" viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="glie-pipeline-desktop-title glie-pipeline-desktop-desc"><title id="glie-pipeline-desktop-title">GLIE의 후보 선택과 복원</title><desc id="glie-pipeline-desktop-desc">모든 쪽을 네 저장 벡터로 먼저 검색한다. 상위 20쪽만 1,031개 벡터를 생성해 재점수한다. 그 밖의 쪽은 복원되지 않고 첫 단계 순서를 유지한다.</desc><defs><marker id="glie-pipeline-desktop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker><marker id="glie-pipeline-desktop-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker></defs><rect width="720" height="540" fill="var(--paper)"/><text x="24" y="68" class="detail">전체 쪽을 검색</text><text x="424" y="68" class="detail">상위 후보만 복원</text>
<path class="edge" d="M 200 240 H 220" marker-end="url(#glie-pipeline-desktop-arrow)"/><path class="edge-focal" d="M 396 220 H 408 Q 416 220 416 212 V 128 Q 416 120 424 120" marker-end="url(#glie-pipeline-desktop-accent)"/><path class="edge" d="M 396 260 H 408 Q 416 260 416 268 V 392 Q 416 400 424 400" marker-end="url(#glie-pipeline-desktop-arrow)"/><path class="edge-focal" d="M 552 120 H 568" marker-end="url(#glie-pipeline-desktop-accent)"/><path class="edge-focal" d="M 632 160 V 220" marker-end="url(#glie-pipeline-desktop-accent)"/><path class="edge" d="M 632 300 V 360" marker-end="url(#glie-pipeline-desktop-arrow)"/><path class="edge" d="M 552 400 H 568" marker-end="url(#glie-pipeline-desktop-arrow)"/>
<rect class="node" x="24" y="200" width="176" height="80" rx="8"/><text x="112" y="232" class="name" text-anchor="middle">저장 코드</text><text x="112" y="258" class="detail" text-anchor="middle">쪽마다 k=4개</text><rect class="node" x="220" y="200" width="176" height="80" rx="8"/><text x="308" y="232" class="name" text-anchor="middle">1차 MaxSim</text><text x="308" y="258" class="detail" text-anchor="middle">전체 쪽의 점수</text><rect class="focal" x="424" y="80" width="128" height="80" rx="8"/><text x="488" y="112" class="name" text-anchor="middle">상위 20쪽</text><text x="488" y="138" class="detail" text-anchor="middle">후보</text><rect class="node" x="568" y="80" width="128" height="80" rx="8"/><text x="632" y="112" class="name" text-anchor="middle">디코더</text><text x="632" y="138" class="detail" text-anchor="middle">N개 생성</text><rect class="node" x="568" y="220" width="128" height="80" rx="8"/><text x="632" y="252" class="name" text-anchor="middle">2차 MaxSim</text><text x="632" y="278" class="detail" text-anchor="middle">생성 벡터</text><rect class="node" x="424" y="360" width="128" height="80" rx="8"/><text x="488" y="392" class="name" text-anchor="middle">나머지 쪽</text><text x="488" y="418" class="detail" text-anchor="middle">1차 순서 유지</text><rect class="node" x="568" y="360" width="128" height="80" rx="8"/><text x="632" y="392" class="name" text-anchor="middle">최종 순위</text><text x="632" y="418" class="detail" text-anchor="middle">후보 + 나머지</text><line class="rule" x1="24" y1="472" x2="696" y2="472"/><text x="24" y="500" class="detail">후보 누락: 상위 20쪽 밖의 정답은 복원할 수 없다.</text><text x="24" y="526" class="detail">복원 오차: 생성 벡터의 점수는 원본과 다를 수 있다.</text></svg>
<svg class="mobile" viewBox="0 0 320 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="glie-pipeline-mobile-title glie-pipeline-mobile-desc"><title id="glie-pipeline-mobile-title">GLIE의 후보 선택과 복원</title><desc id="glie-pipeline-mobile-desc">모든 쪽을 네 저장 벡터로 먼저 검색한다. 상위 20쪽만 1,031개 벡터를 생성해 재점수한다. 그 밖의 쪽은 복원되지 않고 첫 단계 순서를 유지한다.</desc><defs><marker id="glie-pipeline-mobile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker><marker id="glie-pipeline-mobile-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker></defs><rect width="320" height="820" fill="var(--paper)"/>
<path class="edge" d="M 160 96 V 136" marker-end="url(#glie-pipeline-mobile-arrow)"/><path class="edge-focal" d="M 84 208 V 248" marker-end="url(#glie-pipeline-mobile-accent)"/><path class="edge" d="M 236 208 V 248" marker-end="url(#glie-pipeline-mobile-arrow)"/><path class="edge-focal" d="M 84 336 V 376" marker-end="url(#glie-pipeline-mobile-accent)"/><path class="edge-focal" d="M 84 464 V 504" marker-end="url(#glie-pipeline-mobile-accent)"/><path class="edge" d="M 84 592 V 608 Q 84 616 92 616 H 104 Q 112 616 112 624 V 632" marker-end="url(#glie-pipeline-mobile-arrow)"/><path class="edge" d="M 236 336 V 608 Q 236 616 244 616 H 248 Q 256 616 256 624 V 632" marker-end="url(#glie-pipeline-mobile-arrow)"/>
<rect class="node" x="16" y="24" width="288" height="72" rx="8"/><text x="160" y="52" class="name" text-anchor="middle">저장 코드 · 모든 쪽</text><text x="160" y="78" class="detail" text-anchor="middle">쪽마다 k=4개</text><rect class="node" x="16" y="136" width="288" height="72" rx="8"/><text x="160" y="164" class="name" text-anchor="middle">1차 MaxSim</text><text x="160" y="190" class="detail" text-anchor="middle">전체 쪽의 점수</text><rect class="focal" x="16" y="248" width="136" height="88" rx="8"/><text x="84" y="283" class="name" text-anchor="middle">상위 20쪽</text><text x="84" y="313" class="detail" text-anchor="middle">복원 후보</text><rect class="node" x="168" y="248" width="136" height="88" rx="8"/><text x="236" y="283" class="name" text-anchor="middle">나머지 쪽</text><text x="236" y="313" class="detail" text-anchor="middle">1차 순서 유지</text><rect class="node" x="16" y="376" width="136" height="88" rx="8"/><text x="84" y="411" class="name" text-anchor="middle">디코더</text><text x="84" y="441" class="detail" text-anchor="middle">N개 생성</text><rect class="node" x="16" y="504" width="136" height="88" rx="8"/><text x="84" y="539" class="name" text-anchor="middle">2차 MaxSim</text><text x="84" y="569" class="detail" text-anchor="middle">생성 벡터</text><rect class="node" x="16" y="632" width="288" height="72" rx="8"/><text x="160" y="660" class="name" text-anchor="middle">최종 순위</text><text x="160" y="686" class="detail" text-anchor="middle">후보 재점수 + 나머지</text><line class="rule" x1="16" y1="732" x2="304" y2="732"/><text x="16" y="756" class="detail">후보 누락: 20위 밖은 복원 불가</text><text x="16" y="790" class="detail">복원 오차: 생성 ≠ 원본</text></svg>
</div></body></html>
