<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>위임은 결과를 받아들일 때까지 설계한다</title><style>*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}:root{--paper:oklch(97% .018 85);--surface:oklch(94% .018 85);--ink:oklch(24% .018 55);--muted:oklch(42% .018 55);--accent:#93452d;--tint:rgba(147,69,45,.08);--rule:oklch(42% .018 55 / .28);--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;--serif:Georgia,"Times New Roman","Apple SD Gothic Neo","Noto Sans KR",serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}h1{font-family:var(--serif);font-size:24px;font-weight:400;line-height:1.4;margin:14px 16px 8px}.diagram-container{width:100%;max-width:720px;margin:auto}svg{display:block;width:100%;height:auto}.mobile{display:none}text{font-family:var(--sans);fill:var(--ink);font-size:14px}.name{font-size:16px;font-weight:600}.group{font-size:16px;font-weight:600}.detail{font-size:14px;fill:var(--muted)}.mono{font-family:var(--mono);font-size:14px;fill:var(--muted)}.note{font-size:14px;fill:var(--muted)}.node{fill:var(--paper);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.zone{fill:var(--surface);stroke:var(--rule)}.edge{fill:none;stroke:var(--muted);stroke-width:1.5}.accent-edge{stroke:var(--accent)}.rule{stroke:var(--rule)}@media(prefers-color-scheme:dark){:root{--paper:oklch(20% .012 55);--surface:oklch(24% .012 55);--ink:oklch(93% .015 80);--muted:oklch(78% .018 75);--accent:#e5a387;--tint:rgba(229,163,135,.08);--rule:oklch(78% .018 75 / .28)}}@media(max-width:640px){h1{font-size:21px}.desktop{display:none}.mobile{display:block;max-width:300px;margin:auto}.detail,.mono,.note{font-size:16px}}</style></head><body><h1>위임은 결과를 받아들일 때까지 설계한다</h1><div class="diagram-container"><svg class="desktop" viewBox="0 0 720 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-delegation-boundaries-desktop-title agent-delegation-boundaries-desktop-desc"><title id="agent-delegation-boundaries-desktop-title">위임은 결과를 받아들일 때까지 설계한다</title><desc id="agent-delegation-boundaries-desktop-desc">담당 에이전트가 목표와 이전 버전 유지 조건을 하위 에이전트에 전달하고 변경 결과를 검증한다. 도구 실행 권한, 실행 격리, 원래 요청의 완료 판단은 별개의 경계다.</desc><defs><marker id="agent-delegation-boundaries-desktop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker><marker id="agent-delegation-boundaries-desktop-accent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="52" class="note" text-anchor="start">담당자 → 상태와 제약 전달 → 하위 작업 → 원래 목표와 대조</text><line class="edge" x1="168" y1="147" x2="200" y2="147" marker-end="url(#agent-delegation-boundaries-desktop-arrow)"/><line class="edge" x1="344" y1="147" x2="376" y2="147" marker-end="url(#agent-delegation-boundaries-desktop-arrow)"/><line class="edge accent-edge" x1="520" y1="147" x2="552" y2="147" marker-end="url(#agent-delegation-boundaries-desktop-accent-arrow)"/><rect class="node" x="24" y="104" width="144" height="86" rx="6"/><text x="96.0" y="138" class="name" text-anchor="middle">담당자</text><text x="96.0" y="161" class="detail" text-anchor="middle">원래 요청</text><rect class="focal" x="200" y="104" width="144" height="86" rx="6"/><text x="272.0" y="138" class="name" text-anchor="middle">위임 상태</text><text x="272.0" y="161" class="detail" text-anchor="middle">이전 버전 유지</text><rect class="node" x="376" y="104" width="144" height="86" rx="6"/><text x="448.0" y="138" class="name" text-anchor="middle">하위 작업</text><text x="448.0" y="161" class="detail" text-anchor="middle">허용된 도구</text><rect class="focal" x="552" y="104" width="144" height="86" rx="6"/><text x="624.0" y="138" class="name" text-anchor="middle">결과 검증</text><text x="624.0" y="161" class="detail" text-anchor="middle">변경 대조</text><text x="24" y="262" class="group" text-anchor="start">실행과 완료를 가르는 질문</text><line class="rule" x1="24" y1="288" x2="696" y2="288"/><text x="24" y="319" class="name" text-anchor="start">권한</text><text x="128" y="319" class="detail" text-anchor="start">도구 노출은 실행 승인이 아니다.</text><text x="24" y="358" class="name" text-anchor="start">격리</text><text x="128" y="358" class="detail" text-anchor="start">실행이 닿는 범위를 제한한다.</text><text x="24" y="397" class="name" text-anchor="start">완료</text><text x="128" y="397" class="detail" text-anchor="start">테스트 통과 뒤 원래 제약을 확인한다.</text><line class="rule" x1="24" y1="430" x2="696" y2="430"/><text x="24" y="455" class="note" text-anchor="start">가상 문서 수정 사례 · 세 경계는 서로를 대신하지 않는다.</text></svg><svg class="mobile" viewBox="0 0 300 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-delegation-boundaries-mobile-title agent-delegation-boundaries-mobile-desc"><title id="agent-delegation-boundaries-mobile-title">위임은 결과를 받아들일 때까지 설계한다</title><desc id="agent-delegation-boundaries-mobile-desc">담당 에이전트가 목표와 이전 버전 유지 조건을 하위 에이전트에 전달하고 변경 결과를 검증한다. 도구 실행 권한, 실행 격리, 원래 요청의 완료 판단은 별개의 경계다.</desc><defs><marker id="agent-delegation-boundaries-mobile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker><marker id="agent-delegation-boundaries-mobile-accent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="16" y="42" class="note" text-anchor="start">상태 전달과 결과 수용</text><line class="edge" x1="150" y1="148" x2="150" y2="180" marker-end="url(#agent-delegation-boundaries-mobile-arrow)"/><line class="edge" x1="150" y1="264" x2="150" y2="296" marker-end="url(#agent-delegation-boundaries-mobile-arrow)"/><line class="edge accent-edge" x1="150" y1="380" x2="150" y2="412" marker-end="url(#agent-delegation-boundaries-mobile-accent-arrow)"/><rect class="node" x="16" y="64" width="268" height="84" rx="6"/><text x="150.0" y="98" class="name" text-anchor="middle">담당자</text><text x="150.0" y="121" class="detail" text-anchor="middle">원래 요청을 보유</text><rect class="focal" x="16" y="180" width="268" height="84" rx="6"/><text x="150.0" y="214" class="name" text-anchor="middle">위임 상태</text><text x="150.0" y="237" class="detail" text-anchor="middle">목표 · 이전 버전 유지</text><rect class="node" x="16" y="296" width="268" height="84" rx="6"/><text x="150.0" y="330" class="name" text-anchor="middle">하위 작업</text><text x="150.0" y="353" class="detail" text-anchor="middle">허용된 도구로 실행</text><rect class="focal" x="16" y="412" width="268" height="84" rx="6"/><text x="150.0" y="446" class="name" text-anchor="middle">결과 검증</text><text x="150.0" y="469" class="detail" text-anchor="middle">원래 제약과 변경 대조</text><text x="16" y="548" class="group" text-anchor="start">서로 다른 세 경계</text><line class="rule" x1="16" y1="570" x2="284" y2="570"/><text x="16" y="603" class="name" text-anchor="start">권한</text><text x="76" y="603" class="detail" text-anchor="start">도구 노출 ≠ 승인</text><text x="16" y="647" class="name" text-anchor="start">격리</text><text x="76" y="647" class="detail" text-anchor="start">실행 범위 제한</text><text x="16" y="691" class="name" text-anchor="start">완료</text><text x="76" y="691" class="detail" text-anchor="start">원래 제약 검증</text><line class="rule" x1="16" y1="725" x2="284" y2="725"/><text x="16" y="752" class="note" text-anchor="start">가상 문서 수정 사례</text></svg></div></body></html>
