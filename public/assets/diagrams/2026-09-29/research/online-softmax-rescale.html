<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 최대값이 나오면 과거 합도 다시 잰다</title><style>*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}:root{--paper:oklch(97% .018 85);--surface:oklch(94% .018 85);--ink:oklch(24% .018 55);--muted:oklch(42% .018 55);--accent:#93452d;--tint:rgba(147,69,45,.08);--rule:oklch(42% .018 55 / .28);--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;--serif:Georgia,"Times New Roman","Apple SD Gothic Neo","Noto Sans KR",serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}h1{font-family:var(--serif);font-size:24px;font-weight:400;line-height:1.4;margin:14px 16px 8px}.diagram-container{width:100%;max-width:720px;margin:auto}svg{display:block;width:100%;height:auto}.mobile{display:none}text{font-family:var(--sans);fill:var(--ink);font-size:14px}.name{font-size:16px;font-weight:600}.group{font-size:16px;font-weight:600}.detail{font-size:14px;fill:var(--muted)}.mono{font-family:var(--mono);font-size:14px;fill:var(--muted)}.note{font-size:14px;fill:var(--muted)}.node{fill:var(--paper);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.zone{fill:var(--surface);stroke:var(--rule)}.edge{fill:none;stroke:var(--muted);stroke-width:1.5}.accent-edge{stroke:var(--accent)}.rule{stroke:var(--rule)}@media(prefers-color-scheme:dark){:root{--paper:oklch(20% .012 55);--surface:oklch(24% .012 55);--ink:oklch(93% .015 80);--muted:oklch(78% .018 75);--accent:#e5a387;--tint:rgba(229,163,135,.08);--rule:oklch(78% .018 75 / .28)}}@media(max-width:640px){h1{font-size:21px}.desktop{display:none}.mobile{display:block;max-width:300px;margin:auto}.detail,.mono,.note{font-size:16px}}</style></head><body><h1>새 최대값이 나오면 과거 합도 다시 잰다</h1><div class="diagram-container"><svg class="desktop" viewBox="0 0 720 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="online-softmax-rescale-desktop-title online-softmax-rescale-desktop-desc"><title id="online-softmax-rescale-desktop-title">새 최대값이 나오면 과거 합도 다시 잰다</title><desc id="online-softmax-rescale-desktop-desc">첫 블록의 최댓값 ln 2가 새 블록에서 ln 4로 바뀌면 기존 분모 1.5와 분자 25를 각각 0.5배 한 뒤 새 값을 합쳐 출력 30을 얻는다. 배율을 생략하면 26이 된다.</desc><defs><marker id="online-softmax-rescale-desktop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker><marker id="online-softmax-rescale-desktop-accent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="52" class="note" text-anchor="start">한 쿼리 행: 점수 [0, ln 2, ln 4] · 값 [10, 20, 40]</text><line class="edge accent-edge" x1="200" y1="158" x2="272" y2="158" marker-end="url(#online-softmax-rescale-desktop-accent-arrow)"/><line class="edge accent-edge" x1="448" y1="158" x2="520" y2="158" marker-end="url(#online-softmax-rescale-desktop-accent-arrow)"/><rect class="node" x="24" y="112" width="176" height="92" rx="6"/><text x="112.0" y="146" class="name" text-anchor="middle">이전 블록</text><text x="112.0" y="169" class="detail" text-anchor="middle">ℓ=1.5 · u=25</text><rect class="node" x="272" y="112" width="176" height="92" rx="6"/><text x="360.0" y="146" class="name" text-anchor="middle">새 최대 ln 4</text><text x="360.0" y="169" class="detail" text-anchor="middle">과거 합 × 0.5</text><rect class="focal" x="520" y="112" width="176" height="92" rx="6"/><text x="608.0" y="146" class="name" text-anchor="middle">새 값 40</text><text x="608.0" y="169" class="detail" text-anchor="middle">ℓ′=1.75 · u′=52.5</text><text x="24" y="275" class="group" text-anchor="start">왜 0.5인가?</text><text x="24" y="305" class="note" text-anchor="start">exp(ln 2 − ln 4)=0.5</text><text x="24" y="334" class="note" text-anchor="start">기존 분모 ℓ와 분자 u에 같은 배율을 곱한다.</text><text x="24" y="389" class="name" text-anchor="start">52.5 ÷ 1.75 = 30</text><text x="300" y="389" class="detail" text-anchor="start">배율을 빼먹으면 26</text><line class="rule" x1="24" y1="421" x2="696" y2="421"/><text x="24" y="447" class="note" text-anchor="start">설명용 산술 예시 · 실제 GPU 측정치가 아님</text></svg><svg class="mobile" viewBox="0 0 300 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="online-softmax-rescale-mobile-title online-softmax-rescale-mobile-desc"><title id="online-softmax-rescale-mobile-title">새 최대값이 나오면 과거 합도 다시 잰다</title><desc id="online-softmax-rescale-mobile-desc">첫 블록의 최댓값 ln 2가 새 블록에서 ln 4로 바뀌면 기존 분모 1.5와 분자 25를 각각 0.5배 한 뒤 새 값을 합쳐 출력 30을 얻는다. 배율을 생략하면 26이 된다.</desc><defs><marker id="online-softmax-rescale-mobile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker><marker id="online-softmax-rescale-mobile-accent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="16" y="43" class="note" text-anchor="start">점수 [0, ln 2, ln 4]</text><text x="16" y="65" class="note" text-anchor="start">값 [10, 20, 40]</text><line class="edge accent-edge" x1="150" y1="168" x2="150" y2="200" marker-end="url(#online-softmax-rescale-mobile-accent-arrow)"/><line class="edge accent-edge" x1="150" y1="284" x2="150" y2="316" marker-end="url(#online-softmax-rescale-mobile-accent-arrow)"/><line class="edge accent-edge" x1="150" y1="400" x2="150" y2="432" marker-end="url(#online-softmax-rescale-mobile-accent-arrow)"/><rect class="node" x="16" y="84" width="268" height="84" rx="6"/><text x="150.0" y="118" class="name" text-anchor="middle">이전 블록</text><text x="150.0" y="141" class="detail" text-anchor="middle">m=ln 2 · ℓ=1.5 · u=25</text><rect class="node" x="16" y="200" width="268" height="84" rx="6"/><text x="150.0" y="234" class="name" text-anchor="middle">새 최대 ln 4</text><text x="150.0" y="257" class="detail" text-anchor="middle">과거 합 × 0.5</text><rect class="node" x="16" y="316" width="268" height="84" rx="6"/><text x="150.0" y="350" class="name" text-anchor="middle">새 값 40</text><text x="150.0" y="373" class="detail" text-anchor="middle">ℓ′=1.75 · u′=52.5</text><rect class="focal" x="16" y="432" width="268" height="84" rx="6"/><text x="150.0" y="466" class="name" text-anchor="middle">출력 30</text><text x="150.0" y="489" class="detail" text-anchor="middle">52.5 ÷ 1.75</text><text x="16" y="565" class="group" text-anchor="start">왜 0.5인가?</text><text x="16" y="592" class="note" text-anchor="start">exp(ln 2 − ln 4)=0.5</text><text x="16" y="618" class="note" text-anchor="start">기존 ℓ과 u를 같이 줄인다.</text><text x="16" y="665" class="name" text-anchor="start">생략하면 출력은 26</text><line class="rule" x1="16" y1="693" x2="284" y2="693"/><text x="16" y="720" class="note" text-anchor="start">설명용 산술 예시</text></svg></div></body></html>
